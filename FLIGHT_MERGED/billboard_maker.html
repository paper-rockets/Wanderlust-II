<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tree Billboard Maker</title>
    <style>
        body { margin: 0; background: #222; color: #fff; font-family: sans-serif; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
        #toolbar { padding: 10px 20px; background: #333; display: flex; gap: 15px; align-items: center; border-bottom: 1px solid #444; z-index: 10; }
        #container { flex: 1; display: flex; align-items: center; justify-content: center; background: url('data:image/svg+xml;utf8,<svg width="20" height="20" xmlns="http://www.w3.org/2000/svg"><rect width="10" height="10" fill="%23333"/><rect x="10" width="10" height="10" fill="%232a2a2a"/><rect y="10" width="10" height="10" fill="%232a2a2a"/><rect x="10" y="10" width="10" height="10" fill="%23333"/></svg>'); }
        canvas { box-shadow: 0 0 20px rgba(0,0,0,0.5); border: 1px solid #555; background: transparent; }
        button { padding: 6px 12px; background: #4caf50; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #45a049; }
        select, input { padding: 4px; border-radius: 4px; border: 1px solid #666; background: #444; color: white; }
    </style>
    <!-- Import maps polyfill -->
    <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>

<div id="toolbar">
    <label>Load Model: 
        <input type="file" id="file-input" accept=".glb,.gltf">
    </label>

    <label>Rotation: <input type="range" id="rot-slider" min="0" max="360" value="0"></label>

    <label>Mode: 
        <select id="mode-select">
            <option value="albedo">Color (Albedo)</option>
            <option value="normal">Normal Map</option>
        </select>
    </label>

    <label>Resolution:
        <select id="res-select">
            <option value="512">512 x 512</option>
            <option value="1024" selected>1024 x 1024</option>
            <option value="2048">2048 x 2048</option>
        </select>
    </label>

    <button id="btn-capture">📸 Capture PNG</button>
</div>

<div id="container"></div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

// Setup Renderer
let currentRes = 1024;
const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, preserveDrawingBuffer: true });
renderer.setSize(currentRes, currentRes);
renderer.setPixelRatio(1);
document.getElementById('container').appendChild(renderer.domElement);

// Setup Scene & Camera
const scene = new THREE.Scene();
// Orthographic camera ensures flat sprite projection with no perspective distortion
const frustumSize = 120; // Adjust based on tree scale
const aspect = 1;
const camera = new THREE.OrthographicCamera(frustumSize * aspect / -2, frustumSize * aspect / 2, frustumSize / 2, frustumSize / -2, 0.1, 1000);
camera.position.set(0, 50, 100);
camera.lookAt(0, 50, 0);

const loader = new GLTFLoader();
const dracoLoader = new DRACOLoader();
dracoLoader.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.185.0/examples/jsm/libs/draco/');
loader.setDRACOLoader(dracoLoader);

let currentModel = null;

// Materials
const normalMaterial = new THREE.MeshNormalMaterial();

function loadModel(url) {
    if (currentModel) {
        scene.remove(currentModel);
        currentModel = null;
    }

    loader.load(url, (gltf) => {
        currentModel = gltf.scene;
        
        // Cache original materials for Albedo mode
        currentModel.traverse((child) => {
            if (child.isMesh) {
                // Ensure no frustum culling clipping
                child.frustumCulled = false;
                
                // Save the original map and color
                const origMap = child.material.map;
                const origColor = child.material.color;
                
                // Create an unlit material for Albedo to prevent baked shadows
                const albedoMat = new THREE.MeshBasicMaterial({
                    map: origMap,
                    color: origColor,
                    transparent: true,
                    alphaTest: 0.5,
                    side: THREE.DoubleSide
                });
                
                child.userData.albedoMaterial = albedoMat;
                child.material = albedoMat;
            }
        });

        // Center the model
        const box = new THREE.Box3().setFromObject(currentModel);
        const center = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());
        
        currentModel.position.set(-center.x, 0, -center.z); // Keep Y at 0 so trunk is at bottom
        
        // Adjust camera frustum to fit the tree height exactly
        const maxDim = Math.max(size.x, size.y, size.z);
        const newFrustum = maxDim * 1.1; // 10% padding
        camera.left = newFrustum * aspect / -2;
        camera.right = newFrustum * aspect / 2;
        camera.top = newFrustum; // Anchor to bottom
        camera.bottom = 0;
        camera.updateProjectionMatrix();

        scene.add(currentModel);
        updateRenderMode();
        render();
    });
}

function updateRenderMode() {
    if (!currentModel) return;
    const mode = document.getElementById('mode-select').value;
    
    currentModel.traverse((child) => {
        if (child.isMesh) {
            if (mode === 'albedo') {
                child.material = child.userData.albedoMaterial;
            } else if (mode === 'normal') {
                // MeshNormalMaterial outputs view-space normals, which is perfect for camera-facing billboards!
                child.material = normalMaterial;
            }
        }
    });
    render();
}

function render() {
    if (currentModel) {
        const angle = parseInt(document.getElementById('rot-slider').value);
        currentModel.rotation.y = THREE.MathUtils.degToRad(angle);
    }
    renderer.render(scene, camera);
}

document.getElementById('file-input').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) {
        const url = URL.createObjectURL(file);
        loadModel(url);
    }
});
document.getElementById('mode-select').addEventListener('change', updateRenderMode);
document.getElementById('rot-slider').addEventListener('input', render);

document.getElementById('res-select').addEventListener('change', (e) => {
    currentRes = parseInt(e.target.value);
    renderer.setSize(currentRes, currentRes);
    render();
});

document.getElementById('btn-capture').addEventListener('click', () => {
    render(); // Ensure latest frame
    const dataURL = renderer.domElement.toDataURL('image/png');
    const link = document.createElement('a');
    
    let modelName = "model";
    const fileInput = document.getElementById('file-input');
    if (fileInput.files.length > 0) {
        modelName = fileInput.files[0].name.replace('.glb', '').replace('.gltf', '');
    }
    const mode = document.getElementById('mode-select').value;
    const angle = document.getElementById('rot-slider').value;
    
    link.download = `${modelName}_${mode}_${angle}deg.png`;
    link.href = dataURL;
    link.click();
});

</script>
</body>
</html>
