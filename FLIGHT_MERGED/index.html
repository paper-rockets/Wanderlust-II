<script>
function showError(msg) {
    var overlay = document.getElementById('debug-overlay');
    overlay.style.display = 'block';
    overlay.innerHTML += msg + '<br><br>';
}
window.onerror = function(msg, url, line, col, error) {
    showError('Error: ' + msg + ' at line ' + line);
};
window.addEventListener("unhandledrejection", function(event) {
    showError('Unhandled Promise Rejection: ' + (event.reason ? event.reason.message || event.reason : "unknown"));
});
const origConsoleError = console.error;
console.error = function(...args) {
    showError('Console Error: ' + args.join(' '));
    origConsoleError.apply(console, args);
};
</script>

  <script type="module">
import terrainArch from './terrain-archipelago.js';
import terrainGhibli from './terrain-ghibli.js';
import terrainPlains from './terrain-plains.js';
import terrainMtn from './terrain-mountains.js';
import terrainCrystal from './terrain-crystal.js';
import terrainMtn2 from './terrain-mountains2.js';
import terrainJungle from './terrain-jungle.js';

    import * as THREE from 'three';
    import { initTerrainEditor } from './TerrainEditor.js';
    import * as BufferGeometryUtils from 'three/addons/utils/BufferGeometryUtils.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
    import { KTX2Loader } from 'three/addons/loaders/KTX2Loader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
    import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
    import { Lensflare, LensflareElement } from 'three/addons/objects/Lensflare.js';
    import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';
    import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

    // ===== QUALITY TIER =====
    // 'low' targets weak devices (e.g. Galaxy Tab S6 Lite for a young kid).
    // Auto-defaults to low on ≤4GB devices; user choice (saved) always wins.
    // Regular is the untouched full-quality path.
    const _savedGfx = localStorage.getItem('gfxQuality');
    const LOW_GFX = _savedGfx === 'low'
        || (_savedGfx == null && typeof navigator.deviceMemory === 'number' && navigator.deviceMemory <= 4);

    let isWindOn = false;
    let isRainOn = false;
    let isWindTrailsOn = true;
    let isPhotoMode = false;
    let isFlightPaused = false;
    let isShadowsOn = !LOW_GFX;
    let isTreeShadowsOn = false;
    let shadowDistMode = LOW_GFX ? 'Close' : 'Med';
    let isBloomOn = !LOW_GFX;
    let isHD = !LOW_GFX;
    let photoControls = null;
    let cameraZoomDist = 12.0;
    let currentFrame = 0;
    let logicTimer = 0;
    let terrainRes = LOW_GFX ? 64 : 256;
let isInitializingGui = true;

            // PROCEDURAL NOISE & MULTI-BIOMES SETUP
    // ==========================================
    const perm = new Uint8Array(512);
    for (let i = 0; i < 512; i++) perm[i] = Math.floor(Math.random() * 255);
    
    function snoise(x, z) {
        let n0, n1, n2;
        const F2 = 0.5 * (Math.sqrt(3.0) - 1.0);
        const G2 = (3.0 - Math.sqrt(3.0)) / 6.0;
        let s = (x + z) * F2;
        let i = Math.floor(x + s), j = Math.floor(z + s);
        let t = (i + j) * G2;
        let X0 = i - t, Z0 = j - t;
        let x0 = x - X0, z0 = z - Z0;
        let i1, j1;
        if (x0 > z0) { i1 = 1; j1 = 0; } else { i1 = 0; j1 = 1; }
        let x1 = x0 - i1 + G2, z1 = z0 - j1 + G2;
        let x2 = x0 - 1.0 + 2.0 * G2, z2 = z0 - 1.0 + 2.0 * G2;
        let ii = i & 255, jj = j & 255;
        let gi0 = perm[ii + perm[jj]] % 12;
        let gi1 = perm[ii + i1 + perm[jj + j1]] % 12;
        let gi2 = perm[ii + 1 + perm[jj + 1]] % 12;
        let t0 = 0.5 - x0 * x0 - z0 * z0; if (t0 < 0) n0 = 0.0; else { t0 *= t0; n0 = t0 * t0 * (x0 * (gi0 > 5 ? 1 : -1) + z0 * (gi0 % 2 === 0 ? 1 : -1)); }
        let t1 = 0.5 - x1 * x1 - z1 * z1; if (t1 < 0) n1 = 0.0; else { t1 *= t1; n1 = t1 * t1 * (x1 * (gi1 > 5 ? 1 : -1) + z1 * (gi1 % 2 === 0 ? 1 : -1)); }
        let t2 = 0.5 - x2 * x2 - z2 * z2; if (t2 < 0) n2 = 0.0; else { t2 *= t2; n2 = t2 * t2 * (x2 * (gi2 > 5 ? 1 : -1) + z2 * (gi2 % 2 === 0 ? 1 : -1)); }
        return 70.0 * (n0 + n1 + n2);
    }


    const ZONES = [
        { start:      0, end:   8000, module: terrainArch,     treesOk: true,  name: '🌊 Archipelago',        archT: (t) => t * 2.0 },
        { start:   8000, end:  16000, module: terrainGhibli,   treesOk: true,  name: '🌳 Ghibli Land'         },
        { start:  16000, end:  24000, module: terrainPlains,   treesOk: true,  name: '🌾 Golden Plains'        },
        { start:  24000, end:  40000, module: terrainMtn,      treesOk: false, name: '🏔️ Misty Mountains I'   },
        { start:  40000, end:  70000, module: terrainJungle,   treesOk: true,  name: '🌴 Lush Jungle'          },
        { start:  70000, end: 104000, module: terrainCrystal,  treesOk: false, name: '💎 Crystal Land'         },
        { start: 104000, end: 134000, module: terrainMtn2,     treesOk: false, name: '🏔️ Misty Mountains II'  },
        { start: 134000, end: 198000, module: terrainGhibli,   treesOk: true,  name: '🌳 Ghibli Land II'       },
        { start: 198000, end: 214000, module: terrainArch,     treesOk: false, name: '🌊 Open Ocean'           },
    ];
    const WORLD_LENGTH = 214000;
    const BLEND_WIDTH  = 600;
    const blendColor1  = new THREE.Color();
    const blendColor2  = new THREE.Color();

    function _wrapZ(worldZ) {
        return ((worldZ % WORLD_LENGTH) + WORLD_LENGTH) % WORLD_LENGTH;
    }
    function _zoneIdxAt(wrappedZ) {
        for (let i = 0; i < ZONES.length; i++) {
            if (wrappedZ >= ZONES[i].start && wrappedZ < ZONES[i].end) return i;
        }
        return 0;
    }
    function _zoneT(wrappedZ, idx) {
        const zn = ZONES[idx];
        return (wrappedZ - zn.start) / (zn.end - zn.start);
    }
    function _zoneWeights(worldZ) {
        const wz = _wrapZ(worldZ);
        const currIdx = _zoneIdxAt(wz);
        const currZone = ZONES[currIdx];
        const nextIdx = (currIdx + 1) % ZONES.length;
        const distToBoundary = currZone.end - wz;

        if (distToBoundary < BLEND_WIDTH) {
            const blendFactor = distToBoundary / BLEND_WIDTH;
            const w1 = smoothstep(0, 1, blendFactor);
            const w2 = 1.0 - w1;
            return [
                { idx: currIdx, w: w1, t: _zoneT(wz, currIdx) },
                { idx: nextIdx, w: w2, t: _zoneT(wz, nextIdx) }
            ];
        } else {
            return [{ idx: currIdx, w: 1.0, t: _zoneT(wz, currIdx) }];
        }
    }

    function getWorldHeight(worldX, worldZ) {
        const wts = _zoneWeights(worldZ);
        let h = 0;
        for (let i = 0; i < wts.length; i++) {
            const zn = ZONES[wts[i].idx];
            let rawH = zn.module.getHeight(worldX, worldZ, snoise);
            if (zn.archT) rawH = zn.module.getHeight(worldX, worldZ, snoise, zn.archT(wts[i].t));
            h += rawH * wts[i].w;
        }
        return h;
    }
    function getWorldColor(h, worldX, worldZ, targetColor) {
        const wts = _zoneWeights(worldZ);
        if (wts.length === 1) {
            ZONES[wts[0].idx].module.getColor(h, worldX, worldZ, snoise, targetColor, smoothstep);
        } else {
            ZONES[wts[0].idx].module.getColor(h, worldX, worldZ, snoise, blendColor1, smoothstep);
            ZONES[wts[1].idx].module.getColor(h, worldX, worldZ, snoise, blendColor2, smoothstep);
            targetColor.copy(blendColor1).lerp(blendColor2, wts[1].w);
        }
    }



    
    let _mapEl = null;
    let _mapCanvas = null;
    let _mapCtx = null;
    let _mapVisible = true;

    function initMapUI() {
    _mapEl = document.getElementById('world-map');
    _mapCanvas = document.getElementById('map-canvas');
    if (_mapCanvas) {
        _mapCtx = _mapCanvas.getContext('2d');
        _mapCanvas.style.cursor = 'pointer';
        _mapCanvas.addEventListener('click', (e) => {
            const rect = _mapCanvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const ratio = x / rect.width;
            const targetZ = ratio * WORLD_LENGTH;
            const zn = ZONES.find(z => targetZ >= z.start && targetZ <= z.end);
            if (zn && typeof playerGrp !== 'undefined') {
                playerGrp.position.set(0, 80, (zn.start + zn.end) * 0.5);
                if (typeof lastTerrainGridX !== 'undefined') lastTerrainGridX = -9999;
                if (typeof lastTerrainGridZ !== 'undefined') lastTerrainGridZ = -9999;
                if (typeof navParams !== 'undefined' && typeof navFolder !== 'undefined') {
                    navParams.biome = zn.name;
                    navFolder.controllersRecursive().forEach(c => c.updateDisplay());
                }
            }
        });
    }
    const closeMapBtn = document.getElementById('close-map-btn');
    if (closeMapBtn) {
        closeMapBtn.addEventListener('click', () => {
            if (_mapEl) _mapEl.style.display = 'none';
            if (typeof params !== 'undefined') params.showMap = false;
        });
    }
}
initMapUI();

    const _mapColors = {
        '🌊 Archipelago':       '#2a6aad',
        '🌳 Ghibli Land':       '#4a9640',
        '🌾 Golden Plains':     '#c8a832',
        '🏔️ Misty Mountains I': '#6b7280',
        '🌴 Lush Jungle':        '#286330',
        '💎 Crystal Land':      '#5b8fa8',
        '🏔️ Misty Mountains II':'#6b7280',
        '🌳 Ghibli Land II':    '#4a9640',
        '🌊 Open Ocean':        '#1d4ed8',
    };

    function _drawWorldMap() {
        if (!_mapCanvas) _mapCanvas = document.getElementById('map-canvas');
        if (_mapCanvas && !_mapCtx) _mapCtx = _mapCanvas.getContext('2d');
        if (!_mapCanvas || !_mapCtx) return;
        const W = _mapCanvas.width, H = _mapCanvas.height;
        _mapCtx.clearRect(0, 0, W, H);
        
        // 1. Draw Biome Bands with distinct colors & borders
        ZONES.forEach(zn => {
            const x1 = (zn.start / WORLD_LENGTH) * W;
            const x2 = (zn.end   / WORLD_LENGTH) * W;
            _mapCtx.fillStyle = _mapColors[zn.name] || '#555';

            uniform float uIntensity;
            uniform float uDecay;
            uniform float uDensity;
            uniform float uWeight;
            uniform float uSunVisible;
            varying vec2 vUv;

            float pseudoRand(vec2 p) {
                return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453123);

    function smoothstep(edge0, edge1, x) {
        const t = Math.max(0, Math.min(1, (x - edge0) / (edge1 - edge0)));
        return t * t * (3 - 2 * t);
    }

    function distToSegment(px, pz, ax, az, bx, bz) {
        const l2 = (ax - bx)**2 + (az - bz)**2;
        if (l2 === 0) return Math.hypot(px - ax, pz - az);
        let t = ((px - ax) * (bx - ax) + (pz - az) * (bz - az)) / l2;
        t = Math.max(0, Math.min(1, t));
        return Math.hypot(px - (ax + t * (bx - ax)), pz - (az + t * (bz - az)));
    }

    function getPathStrength(x, z) {
        const scale = 0.002;
        const n1 = snoise(x * scale, z * scale);
        const n2 = snoise(x * scale * 2 + 1000, z * scale * 2 + 1000) * 0.3;
        let path = Math.abs(n1 + n2);
        let mask = smoothstep(0.15, 0.0, path); // wider, softer path
        return mask;
    }

    function updateTerrainGeometry(playerX, playerZ) {
        const vertexSpacing = 4000 / terrainRes;
        const gridX = Math.floor(playerX / vertexSpacing) * vertexSpacing;
        const gridZ = Math.floor(playerZ / vertexSpacing) * vertexSpacing;
        
        if (gridX === lastTerrainGridX && gridZ === lastTerrainGridZ) return;
        
        terrain.position.set(gridX, 0, gridZ);
        
        const pos = terrainGeo.attributes.position;
        if (!terrainGeo.attributes.color) {
            terrainGeo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(pos.count * 3), 3));
        }
        const colors = terrainGeo.attributes.color;

        for (let i = 0; i < pos.count; i++) {
            const worldX = pos.getX(i) + gridX;
            const worldZ = pos.getZ(i) + gridZ;
            const h = getWorldHeight(worldX, worldZ);
            pos.setY(i, h);

            getWorldColor(h, worldX, worldZ, tempColor);
            
            // Add dirt path
            const pathMask = getPathStrength(worldX, worldZ);
            if (pathMask > 0 && h > 2.0 && h < 25.0) {
                tempColor.lerp(colorPath, pathMask * 0.85);
            }

            colors.setXYZ(i, tempColor.r, tempColor.g, tempColor.b);
        }
        
        terrainGeo.computeVertexNormals(); 
        pos.needsUpdate = true;
        colors.needsUpdate = true;
        
        lastTerrainGridX = gridX;
        lastTerrainGridZ = gridZ;
    }

    function updateBirdsGen(data, inst, count, tX, tY, tZ, time, dt, centerPull) {
        for (let i = 0; i < count; i++) {
            let px = data[i * 6 + 0], py = data[i * 6 + 1], pz = data[i * 6 + 2];
            let vx = data[i * 6 + 3], vy = data[i * 6 + 4], vz = data[i * 6 + 5];

            let cx = 0, cy = 0, cz = 0;
            let sx = 0, sy = 0, sz = 0;
            let ax = 0, ay = 0, az = 0;
            let n = 0;

            for (let j = 0; j < count; j++) {
                if (i === j) continue;
                let dx = px - data[j * 6 + 0], dy = py - data[j * 6 + 1], dz = pz - data[j * 6 + 2];
                let distSq = dx*dx + dy*dy + dz*dz;
                
                if (distSq < 1200) { 
                    cx += data[j * 6 + 0]; cy += data[j * 6 + 1]; cz += data[j * 6 + 2];
                    ax += data[j * 6 + 3]; ay += data[j * 6 + 4]; az += data[j * 6 + 5];
                    n++;
                }
                if (distSq < 400) { 
                    sx += dx; sy += dy; sz += dz;
                }
            }

            if (n > 0) {
                cx /= n; cy /= n; cz /= n;
                ax /= n; ay /= n; az /= n;
                vx += (cx - px) * 0.4 * dt;
                vy += (cy - py) * 0.4 * dt;
                vz += (cz - pz) * 0.4 * dt;
                vx += (ax - vx) * 0.1 * dt;
                vy += (ay - vy) * 0.1 * dt;
                vz += (az - vz) * 0.1 * dt;
            }
            
            vx += sx * 1.8 * dt; vy += sy * 1.8 * dt; vz += sz * 1.8 * dt;

            // Give each bird an offset slot around Kiki so they soar gracefully around her rather than clumping
            let formAngle = (i / count) * Math.PI * 2.0;
            let formRadius = 22 + (i % 6) * 9;
            let targetX = tX + Math.cos(formAngle) * formRadius;
            let targetY = tY + ((i % 5) - 2) * 3.5;
            let targetZ = tZ + Math.sin(formAngle) * formRadius;

            let tx = targetX - px, ty = targetY - py, tz = targetZ - pz;
            let dToT = Math.sqrt(tx*tx + ty*ty + tz*tz);
            if (dToT > 3) {
                let pullFactor = (dToT > 100) ? centerPull * 4.0 : centerPull * 1.2;
                vx += (tx / dToT) * pullFactor * dt;
                vy += (ty / dToT) * pullFactor * dt;
                vz += (tz / dToT) * pullFactor * dt;
            }

            let maxSpd = (centerPull > 3.0 && typeof velocity !== 'undefined') ? Math.max(40, velocity * 1.2) : 35;
            let spd = Math.sqrt(vx*vx + vy*vy + vz*vz);
            if (spd > maxSpd) { vx *= maxSpd/spd; vy *= maxSpd/spd; vz *= maxSpd/spd; }
            if (spd < 15) { vx *= 15/spd; vy *= 15/spd; vz *= 15/spd; }

            px += vx * dt; py += vy * dt; pz += vz * dt;
            data[i * 6 + 0] = px; data[i * 6 + 1] = py; data[i * 6 + 2] = pz;
            data[i * 6 + 3] = vx; data[i * 6 + 4] = vy; data[i * 6 + 5] = vz;

            dummy.position.set(px, py, pz);
            let targetYaw = Math.atan2(vx, vz);
            let roll = Math.max(-0.6, Math.min(0.6, sx * 0.05));
            dummy.rotation.set(roll, targetYaw, Math.sin(time * 12 + i) * 0.35);
            dummy.scale.setScalar(0.42);
            dummy.updateMatrix();
            inst.setMatrixAt(i, dummy.matrix);
        }
        inst.instanceMatrix.needsUpdate = true;
    }

    // Merges Bark + Leaves primitives into ONE geometry with vertex colors.

    function applyGLBPineTree(gltf, targetInstancedMeshes, targetHeight) {
        // GLTFLoader creates separate THREE.Mesh per primitive
        const childMeshes = [];
        gltf.scene.traverse((child) => {
            if (child.isMesh) childMeshes.push(child);
        });
        if (childMeshes.length === 0) return;

        // Compute overall bounding box for uniform scaling
        const bbox = new THREE.Box3();
        childMeshes.forEach(m => {
            m.geometry.computeBoundingBox();
            bbox.expandByObject(m);
        });
        const modelHeight = bbox.max.y - bbox.min.y;
        const sc = modelHeight > 0 ? (targetHeight / modelHeight) : 1.0;
        const offsetY = -bbox.min.y;

        // Colors for each primitive
        const partColors = [
            new THREE.Color(0x8B6B4A),  // [0] Bark — warm brown
            new THREE.Color(0x4CAF50),  // [1] Leaves — bright green
        ];

        // Scale each geometry and stamp vertex colors
        const coloredGeos = childMeshes.map((m, idx) => {
            const g = m.geometry.clone();
            g.translate(0, offsetY, 0);
            g.scale(sc, sc, sc);

            // Remove any existing COLOR_0 attribute from GLB
            if (g.attributes.color) g.deleteAttribute('color');

            // Stamp solid vertex color for this part
            const vertCount = g.attributes.position.count;
            const colors = new Float32Array(vertCount * 3);
            const c = partColors[Math.min(idx, partColors.length - 1)];
            for (let i = 0; i < vertCount; i++) {
                colors[i * 3]     = c.r;
                colors[i * 3 + 1] = c.g;
                colors[i * 3 + 2] = c.b;
            }
            g.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            // Ensure indexed geometry for merge compatibility
            if (!g.index) {
                const indices = new Uint32Array(vertCount);
                for (let i = 0; i < vertCount; i++) indices[i] = i;
                g.setIndex(new THREE.BufferAttribute(indices, 1));
            }

            g.computeBoundingBox();
            g.computeBoundingSphere();
            return g;
        });

        // Merge all primitives into a single geometry
        const mergedGeom = BufferGeometryUtils.mergeGeometries(coloredGeos, false);
        if (!mergedGeom) return;
        mergedGeom.computeBoundingBox();
        mergedGeom.computeBoundingSphere();

        // Single toon material with vertex colors — 1 draw call
        const mergedMat = new THREE.MeshToonMaterial({
            vertexColors: true,
            gradientMap: gradientMap,
            side: THREE.DoubleSide,
            dithering: true
        });

        targetInstancedMeshes.forEach(instMesh => {
            instMesh.geometry = mergedGeom;
            instMesh.material = mergedMat;
            instMesh.instanceColor = null;
        });
    }

            const newDist = Math.sqrt(dx*dx + dy*dy);

        let dy = touch.clientY - centerY;

    function tickMovement(delta, inputState, character, globalVelocity) {
        // Steering
        if (inputState.left) {
            turnVelocity += turnAcceleration * delta;
        } else if (inputState.right) {
            turnVelocity -= turnAcceleration * delta;
        } else {
            turnVelocity = THREE.MathUtils.lerp(turnVelocity, 0, 3.5 * delta); 
        }
        
        turnVelocity = Math.max(-maxTurnSpeed, Math.min(maxTurnSpeed, turnVelocity));
        currentYaw += turnVelocity * delta;

        // Banking
        let targetRoll = (turnVelocity / maxTurnSpeed) * maxBankAngle;
        currentRoll = THREE.MathUtils.lerp(currentRoll, targetRoll, 1.5 * delta); 

        // Altitude Control
        let targetPitch = -0.18; // Default
        if (inputState.up) { 
            targetPitch = maxPitchAngle; 
        } else if (inputState.down) {
            targetPitch = -maxPitchAngle; 
        }
        currentPitch = THREE.MathUtils.lerp(currentPitch, targetPitch, 1.5 * delta);

        // Apply Rotations
        eulerRotation.set(currentPitch, currentYaw, currentRoll, 'YXZ');
        targetQuaternion.setFromEuler(eulerRotation);
        
        // Soft camera auto-leveling
        if (!inputState.left && !inputState.right && !inputState.up && !inputState.down) {
            character.quaternion.slerp(targetQuaternion, 1.2 * delta); 
        } else {
            character.quaternion.slerp(targetQuaternion, 5.0 * delta); 
        }

        const movementDirection = new THREE.Vector3(0, 0, -1); 
        movementDirection.applyQuaternion(character.quaternion);
        
        let activeSpeed = globalVelocity; 
        character.position.add(movementDirection.multiplyScalar(activeSpeed * delta));

        // Anti-Clipping Floor Constraint (Metric calculation)
        const minimumFlightHeight = 18; 
        if (character.position.y < minimumFlightHeight) {
            character.position.y = minimumFlightHeight;
        }

        // Camera Base Tracking
        cameraBase.position.copy(character.position);
        
        eulerRotation.set(0, currentYaw, 0, 'YXZ'); 
        baseTargetQuat.setFromEuler(eulerRotation);
        
        cameraBase.quaternion.slerp(baseTargetQuat, 2.8 * delta);

        camera.quaternion.slerp(new THREE.Quaternion(), 2.0 * delta);
    }

        if (typeof window._currentShadowSize === 'undefined' || window._currentShadowSize !== shadowSize) {
            window._currentShadowSize = shadowSize;
            dirLight.shadow.camera.left = -shadowSize;
            dirLight.shadow.camera.right = shadowSize;
            dirLight.shadow.camera.top = shadowSize;
            dirLight.shadow.camera.bottom = -shadowSize;

        }

                z += velocity * 3.0 * dt; 
                if (z > 50) {
                     z -= 100;
                     trailsData[i*4] = (Math.random() - 0.5) * 80;
                     trailsData[i*4+1] = (Math.random() - 0.5) * 60;
                }
                trailsData[i*4+2] = z;
                
                dummy.position.set(trailsData[i*4], trailsData[i*4+1], z);
                dummy.position.x += Math.sin(time * 3.0 + trailsData[i*4+3] * 10) * 0.5;

    function createReverb() {
        const length = audioCtx.sampleRate * (LOW_GFX ? 0.5 : 4); 
        const impulse = audioCtx.createBuffer(2, length, audioCtx.sampleRate);
        for (let i = 0; i < 2; i++) {
            const channel = impulse.getChannelData(i);
            for (let j = 0; j < length; j++) {
                channel[j] = (Math.random() * 2 - 1) * Math.pow(1 - j / length, 3);
            }
        }
        const convolver = audioCtx.createConvolver();
        convolver.buffer = impulse;
        return convolver;
    }

    function playNote(freq, time, duration, oscType, isPad = false) {
        const osc = audioCtx.createOscillator();
        const env = audioCtx.createGain();
        const filter = audioCtx.createBiquadFilter();
        
        osc.type = oscType;
        osc.frequency.value = freq;
        
        filter.type = 'lowpass';
        
        if (isPad) {
            filter.frequency.value = 600;
            env.gain.setValueAtTime(0, time);
            env.gain.linearRampToValueAtTime(0.04, time + duration * 0.4);
            env.gain.linearRampToValueAtTime(0.001, time + duration);
        } else {
            filter.frequency.setValueAtTime(1200, time);
            filter.frequency.exponentialRampToValueAtTime(400, time + duration);
            env.gain.setValueAtTime(0, time);
            env.gain.linearRampToValueAtTime(0.1, time + 0.05); // Quick attack
            env.gain.exponentialRampToValueAtTime(0.001, time + duration);
        }
        
        osc.connect(filter);
        filter.connect(env);
        env.connect(musicGain);
        
        osc.start(time);
        osc.stop(time + duration);
    }

    function scheduleNotes() {
        if (!isMusicPlaying || !audioCtx) return;
        const track = tracks[currentTrack];
        
        // Prevent massive scheduling clump if tab was inactive
        if (nextNoteTime < audioCtx.currentTime - 0.5) {
            nextNoteTime = audioCtx.currentTime + 0.1;
        }
        
        while (nextNoteTime < audioCtx.currentTime + 0.2) {
            
            // On chord change
            if (sequenceTime % track.speed === 0) {
                const chord = track.chords[chordIndex % track.chords.length];
                
                // Play pad for the chord
                chord.forEach(freq => {
                    playNote(freq / 2, nextNoteTime, track.speed / 1000 * 1.5, track.padOsc, true);
                });
            }
            
            const chord = track.chords[chordIndex % track.chords.length];
            const pattern = arpPatterns[chordIndex % arpPatterns.length];
            
            // Music box arpeggio step
            if (sequenceTime % track.stepSpeed === 0) {
                const arpFreq = chord[pattern[arpIndex % pattern.length]] * 2; // Up one octave
                playNote(arpFreq, nextNoteTime, track.stepSpeed / 1000 * 2.0, track.leadOsc, false);
                arpIndex++;
                
                // Occasional slow melody note
                if (Math.random() > 0.7) {
                    const melFreq = chord[Math.floor(Math.random() * chord.length)] * 4; // Up two octaves
                    playNote(melFreq, nextNoteTime, track.speed / 1000 * 0.8, track.leadOsc, false);
                }
            }
            
            // Timing
            nextNoteTime += track.stepSpeed / 1000;
            sequenceTime += track.stepSpeed;
            
            if (sequenceTime >= track.speed) {
                sequenceTime = 0;
                chordIndex++;
                arpIndex = 0;
            }
        }
        musicTimerID = setTimeout(scheduleNotes, 50);
    }

            const newColor = new THREE.Color(newHexVal);
            const temp = new THREE.Color();
            
            treeMeshes.forEach(mesh => {
                const count = mesh.maxCount || mesh.count;
                for (let i = 0; i < count; i++) {
                    mesh.getColorAt(i, temp);
                    if (Math.abs(temp.r - oldColor.r) < 0.01 && Math.abs(temp.g - oldColor.g) < 0.01 && Math.abs(temp.b - oldColor.b) < 0.01) {
                        mesh.setColorAt(i, newColor);
                    }
                }
                if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
            });
            oldTreeColors[idx] = newHexVal;
        }

        const treeFolder = gui.addFolder('Tree Editor');
        treeFolder.add(params, 'treeScale', 0.5, 4.0).name('Tree Scale').onChange(v => treeUniforms.uTreeScale.value = v);
        treeFolder.addColor(params, 'treeColor0').name('Color 1').onChange(v => updateTreeColorForIndex(0, v));
        treeFolder.addColor(params, 'treeColor1').name('Color 2').onChange(v => updateTreeColorForIndex(1, v));
        treeFolder.addColor(params, 'treeColor2').name('Color 3').onChange(v => updateTreeColorForIndex(2, v));
        treeFolder.addColor(params, 'treeColor3').name('Color 4').onChange(v => updateTreeColorForIndex(3, v));
        treeFolder.addColor(params, 'treeColor4').name('Color 5').onChange(v => updateTreeColorForIndex(4, v));
        treeFolder.addColor(params, 'treeColor5').name('Color 6').onChange(v => updateTreeColorForIndex(5, v));
        treeFolder.addColor(params, 'treeColor6').name('Color 7').onChange(v => updateTreeColorForIndex(6, v));

        // ==========================================
        // SYSTEM SETTINGS (SAVE/LOAD)
        // ==========================================
        const sysFolder = gui.addFolder('System Settings');
        sysFolder.add({
            saveSettings: () => {
                const data = gui.save();
                localStorage.setItem('flightSettings', JSON.stringify(data));
                const prevTitle = sysFolder.title || 'System Settings';
                sysFolder.title('Saved!');
                setTimeout(() => sysFolder.title(prevTitle), 1500);
            }
        }, 'saveSettings').name('Save All Settings');
        
        sysFolder.add({
            resetSettings: () => {
                localStorage.removeItem('flightSettings');
                localStorage.removeItem('gfxQuality');
                location.reload();
            }
        }, 'resetSettings').name('Reset to Default');

        // Load settings if they exist
        try {
            const savedData = localStorage.getItem('flightSettings');
            if (savedData) gui.load(JSON.parse(savedData));
        } catch(e) {
            console.error('Failed to load settings', e);
        }
        
        isInitializingGui = false;
    }

    animate();
  </script>
</body>
</html>
