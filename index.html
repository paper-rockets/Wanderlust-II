<head>
  <meta charset="UTF-8" />

  <title>Wanderlust</title>
  <style>
    :root { color-scheme: dark; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: #62b1e8;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      touch-action: none; 
      user-select: none;
    }
    #app { position: fixed; inset: 0; touch-action: none; }
    canvas { display: block; touch-action: none; }
    
    #touch-controls {
      position: fixed; inset: 0; z-index: 20; pointer-events: none;
    }
    
    #joystick-base {
      position: absolute; left: 40px; bottom: 40px;
      width: 100px; height: 100px; border-radius: 50%;
      background: rgba(255, 255, 255, 0.05); border: 1.5px dashed rgba(255, 255, 255, 0.15);
      pointer-events: auto;
      opacity: 0.3 !important; /* Low opacity/see-through */
    }
    
    #joystick-knob {
      position: absolute; left: 50%; top: 50%;
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    #boost-btn {
      position: fixed; right: 20px; bottom: 25px;
      width: 75px; height: 75px; border-radius: 50%;
      color: rgba(255, 255, 255, 0.4); font-weight: bold; font-size: 14px;
      display: flex; align-items: center; justify-content: center;
      user-select: none; pointer-events: auto;
      box-shadow: none;
      background: rgba(255, 255, 255, 0.05); border: 1.5px dashed rgba(255, 255, 255, 0.15);
      transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 20;
      opacity: 0.3 !important; /* Low opacity/see-through */
    }

    #touch-controls {
      display: none;
    }
    body.force-mobile #touch-controls,
    .force-mobile #touch-controls {
      display: block !important;
    }

    .dg { zoom: 1.2 !important; }
    .dg.ac { zoom: 1.2 !important; }
  </style>
  <script>
    (function() {
      var params = new URLSearchParams(window.location.search);
      var isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0) || (window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
      var isMobileUA = /Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|webOS/i.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
      var isTouchOnly = window.matchMedia && window.matchMedia('(hover: none) and (pointer: coarse)').matches;
      var isMobile = params.has('mobile') || (isMobileUA && isTouch) || isTouchOnly;
      if (isMobile) {
        document.documentElement.classList.add('force-mobile');
        document.addEventListener('DOMContentLoaded', function() {
          document.body.classList.add('force-mobile');
        });
      }
    })();
  </script>

  <style>

    #top-bar {
      position: fixed;
      top: 18px;
      right: 20px;
      left: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      z-index: 100;
      pointer-events: none;
      background: transparent;
      padding: 0;
      border: none;
    }
    #top-bar > * { pointer-events: auto; }

    .top-bar-left {
      display: flex;
      align-items: center;
      gap: 12px;
      pointer-events: none;
    }
    .top-bar-left > * { pointer-events: auto; }

      display: flex;
      align-items: center;
      gap: 10px;
      pointer-events: none;
    }
    .top-bar-right > * { pointer-events: auto; }

    }

      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.4px;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.4), 0 0 8px rgba(0, 0, 0, 0.25);

      pointer-events: none;
      line-height: 1;
      white-space: nowrap;
    }
    .top-save-container {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      pointer-events: auto;

    #top-bar #top-save-setting-btn,

      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: rgba(15, 20, 28, 0.94);

      border-radius: 8px;
      padding: 4px 10px;
      color: rgba(255, 255, 255, 0.92);

      font-weight: 600;
      letter-spacing: 0.4px;

      pointer-events: auto;

      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
      line-height: 1;
      white-space: nowrap;
    }

    }
    #top-bar #top-save-setting-btn:active,
    #top-bar #top-save-all-btn:active {
      transform: translateY(0px) scale(0.96);
      background: rgba(15, 20, 28, 0.98);
    }
    .save-gui-menu.lil-gui.root {
      position: fixed !important;
      top: 58px !important;
      left: 80px !important;
      right: auto !important;
      max-width: min(280px, 92vw) !important;
      width: 250px !important;
      max-height: calc(100vh - 78px) !important;
      overflow-y: auto !important;
      border-radius: 12px !important;
      background: rgba(15, 20, 28, 0.96) !important;
      border: 1px solid rgba(255, 255, 255, 0.15) !important;

      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif !important;
    }
    #top-model-select {
      background: rgba(15, 20, 28, 0.94);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      padding: 4px 10px;
      color: rgba(255, 255, 255, 0.95);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.4px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);

      pointer-events: auto;

    #top-bar button {

      border: none;

      padding: 4px;

    /* Mobile / Portrait Responsive Top Bar */
    @media (max-width: 768px), (orientation: portrait) {
      #top-bar {
        left: 10px;
        right: 10px;
        top: 10px;
        flex-direction: column;
        align-items: stretch;
        gap: 6px;
      }

        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 6px;
      }

        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 4px;
      }
      .top-action-buttons {
        gap: 4px;
      }

      #biome-label { font-size: 10px !important; max-width: 100px; overflow: hidden; text-overflow: ellipsis; }

        padding: 3px 5px !important;
      }

        padding: 3px 4px !important;

      }
      #top-bar button {
        padding: 2px !important;
      }
    }

    body.force-mobile #top-bar,
    .force-mobile #top-bar {
      left: 10px;
      right: 10px;
      top: 10px;
      flex-direction: column;
      align-items: stretch;
      gap: 6px;
    }
    body.force-mobile .top-bar-left,
    .force-mobile .top-bar-left {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }
    body.force-mobile .top-bar-right,
    .force-mobile .top-bar-right {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;

    }

    }
    body.force-mobile #fps-counter,
    .force-mobile #fps-counter {

    body.force-mobile #biome-label,
    .force-mobile #biome-label {
      font-size: 10px !important;
      max-width: 100px;

    .force-mobile #top-bar #top-save-all-btn {
      font-size: 10px !important;
      padding: 3px 5px !important;
    }
    body.force-mobile #top-model-select,
    .force-mobile #top-model-select {

      padding: 3px 4px !important;
      max-width: 95px;
    }
    body.force-mobile #top-bar button,
    .force-mobile #top-bar button {

    /* Fullscreen UI Visibility: hide all HUD except exit fullscreen */

    .is-fullscreen .top-bar-left,
    body.is-fullscreen #top-model-select,
    .is-fullscreen #top-model-select,
    body.is-fullscreen #top-music-btn,
    .is-fullscreen #top-music-btn,
    body.is-fullscreen #top-engine-btn,
    .is-fullscreen #top-engine-btn,
    body.is-fullscreen #pause-toggle,
    .is-fullscreen #pause-toggle,
    body.is-fullscreen #time-toggle,
    .is-fullscreen #time-toggle,
    body.is-fullscreen #gui-toggle-btn,
    .is-fullscreen #gui-toggle-btn,
    body.is-fullscreen .lil-gui.root,
    .is-fullscreen .lil-gui.root,
    body.is-fullscreen #crystal-editor,
    .is-fullscreen #crystal-editor {
      display: none !important;
    }

    body.is-fullscreen #top-bar,
    .is-fullscreen #top-bar {
      flex-direction: row !important;
      justify-content: flex-end !important;
      pointer-events: none !important;
    }

    body.is-fullscreen .top-bar-right,
    .is-fullscreen .top-bar-right {
      width: auto !important;
      justify-content: flex-end !important;
      pointer-events: none !important;
    }

    body.is-fullscreen #fullscreen-toggle,
    .is-fullscreen #fullscreen-toggle {
      display: inline-flex !important;
      pointer-events: auto !important;
    }

    /* lil-gui positioning below top bar */
    .lil-gui.root {
      position: fixed !important;
      top: 58px !important;
      right: 20px !important;
      left: auto !important;
      max-width: min(340px, 92vw) !important;
      max-height: calc(100vh - 78px) !important;
      overflow-y: auto !important;
      border-radius: 12px !important;
      background: rgba(15, 20, 28, 0.96) !important;
      border: 1px solid rgba(255, 255, 255, 0.15) !important;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6) !important;
      z-index: 95 !important;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif !important;
    }
    
  </style>

<div id="debug-overlay" style="position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; background: #b91c1c; color: #ffffff; padding: 16px 24px; border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); max-width: 90%; display: none;"></div>
<script>
function showError(msg) {
    var overlay = document.getElementById('debug-overlay');
    if (!overlay) return;
    overlay.style.display = 'block';
    overlay.innerHTML = '<div style="font-family: sans-serif; font-size: 14px; line-height: 1.5;">' +
        '<div style="font-weight: bold; margin-bottom: 6px;">Runtime Notification</div>' +
        '<div style="margin-bottom: 12px; word-break: break-word;">' + msg + '</div>' +
        '<div style="display: flex; gap: 8px;">' +
            '<a href="?webgl=1" style="display: inline-block; padding: 6px 12px; background: #ffffff; color: #000000; text-decoration: none; border-radius: 4px; font-weight: bold; font-size: 12px;">WebGL Fallback Mode</a>' +
            '<button onclick="window.location.reload()" style="padding: 6px 12px; background: rgba(255,255,255,0.2); color: #ffffff; border: 1px solid #ffffff; border-radius: 4px; font-weight: bold; font-size: 12px; cursor: pointer;">Reload</button>' +
            '<button onclick="this.closest(\'#debug-overlay\').style.display=\'none\'" style="padding: 6px 12px; background: transparent; color: #ffffff; border: 1px solid rgba(255,255,255,0.5); border-radius: 4px; font-size: 12px; cursor: pointer;">Dismiss</button>' +
        '</div>' +
    '</div>';
}
window.onerror = function(msg, url, line, col, error) {
    if (msg && (msg.includes('ResizeObserver') || msg.includes('Script error'))) return;
    showError('Error: ' + msg + ' at line ' + line);
};
window.addEventListener("unhandledrejection", function(event) {
    var reason = event.reason ? (event.reason.message || event.reason) : "unknown";
    if (reason && reason.includes('Device Lost')) return;
    showError('Unhandled Rejection: ' + reason);
});
</script>

  <div id="crystal-editor" style="display: none; position: fixed; left: 20px; top: 20px; width: 240px; box-sizing: border-box; background: rgba(10, 14, 22, 0.96); color: white; padding: 15px; border-radius: 10px; font-family: sans-serif; z-index: 100; max-height: 80vh; overflow-y: auto; border: 1px solid rgba(255,255,255,0.2);">
    <h3 style="margin-top:0; margin-bottom:10px; font-size:16px;">Crystal & Env Editor</h3>
    <div style="margin-bottom: 10px; padding-bottom: 5px; border-bottom: 1px solid #444;">
      <strong style="font-size:13px; display:block; margin-bottom:5px; color:#aaa;">Flying Crystals</strong>
      <div style="display:flex; flex-wrap:wrap; gap:5px; margin-bottom: 5px;">
        <input type="color" id="c-f-col0" value="#6a00ff" style="width:25px;height:25px;padding:0;border:none;cursor:pointer;">
        <input type="color" id="c-f-col1" value="#ff0066" style="width:25px;height:25px;padding:0;border:none;cursor:pointer;">
        <input type="color" id="c-f-col2" value="#ff6600" style="width:25px;height:25px;padding:0;border:none;cursor:pointer;">
        <input type="color" id="c-f-col3" value="#ffcc00" style="width:25px;height:25px;padding:0;border:none;cursor:pointer;">
        <input type="color" id="c-f-col4" value="#00ffaa" style="width:25px;height:25px;padding:0;border:none;cursor:pointer;">
        <input type="color" id="c-f-col5" value="#00aaff" style="width:25px;height:25px;padding:0;border:none;cursor:pointer;">
      </div>
      <label style="font-size:12px; display:block; margin-bottom:4px;">Opacity <input type="range" id="c-fly-opacity" min="0" max="1" step="0.05" value="1.0" style="width:100%; box-sizing:border-box; display:block;"></label>
      <label style="font-size:12px; display:block; margin-bottom:4px;">Contrast <input type="range" id="c-fly-contrast" min="0.1" max="3" step="0.1" value="1.0" style="width:100%; box-sizing:border-box; display:block;"></label>
      <label style="font-size:12px; display:block; margin-bottom:4px;">Hue Shift <input type="range" id="c-fly-hue" min="0" max="1" step="0.01" value="0.0" style="width:100%; box-sizing:border-box; display:block;"></label>
      <label style="font-size:12px; display:block; margin-bottom:4px;">Base Glow <input type="range" id="c-baseGlow" min="0" max="3" step="0.1" value="1.2" style="width:100%; box-sizing:border-box; display:block;"></label>
      <label style="font-size:12px; display:block; margin-bottom:4px;">Night Glow <input type="range" id="c-nightGlow" min="0" max="5" step="0.1" value="1.5" style="width:100%; box-sizing:border-box; display:block;"></label>
      <label style="font-size:12px; display:block; margin-bottom:4px;">Roughness <input type="range" id="c-roughness" min="0" max="1" step="0.05" value="0.08" style="width:100%; box-sizing:border-box; display:block;"></label>
      <label style="font-size:12px; display:block; margin-bottom:4px;">Metalness <input type="range" id="c-metalness" min="0" max="1" step="0.05" value="0.15" style="width:100%; box-sizing:border-box; display:block;"></label>
      <label style="font-size:12px; display:block; margin-bottom:4px;">Transmission <input type="range" id="c-transmission" min="0" max="1" step="0.05" value="0.0" style="width:100%; box-sizing:border-box; display:block;"></label>
      <label style="font-size:12px; display:block; margin-bottom:4px;">Thickness <input type="range" id="c-thickness" min="0" max="20" step="0.5" value="10.0" style="width:100%; box-sizing:border-box; display:block;"></label>
    </div>
    <div style="margin-bottom: 5px;">
      <strong style="font-size:13px; display:block; margin-bottom:5px; color:#aaa;">Ground Crystals (Colors)</strong>
      <div style="display:flex; flex-wrap:wrap; gap:5px;">
        <input type="color" id="c-col0" value="#aa00ff" style="width:25px;height:25px;padding:0;border:none;cursor:pointer;">
        <input type="color" id="c-col1" value="#00ccff" style="width:25px;height:25px;padding:0;border:none;cursor:pointer;">
        <input type="color" id="c-col2" value="#ff0088" style="width:25px;height:25px;padding:0;border:none;cursor:pointer;">
        <input type="color" id="c-col3" value="#00ff88" style="width:25px;height:25px;padding:0;border:none;cursor:pointer;">
        <input type="color" id="c-col4" value="#ffaa00" style="width:25px;height:25px;padding:0;border:none;cursor:pointer;">
        <input type="color" id="c-col5" value="#ff00cc" style="width:25px;height:25px;padding:0;border:none;cursor:pointer;">
      </div>
    </div>
    <button id="c-close" style="margin-top: 15px; width: 100%; padding: 6px; cursor:pointer; background: #333; color: white; border: 1px solid #555; border-radius: 4px; font-weight: bold; box-sizing: border-box;">Close Editor</button>
  </div>

  <div id="touch-controls">
    <div id="joystick-base"><div id="joystick-knob"></div></div>
    <div id="boost-btn">BOOST</div>
  </div>
  


  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js",
      "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.webgpu.js",
      "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.tsl.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.0/examples/jsm/",
      "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.185.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
