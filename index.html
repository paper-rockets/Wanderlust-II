<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <title>Wanderlust</title>
  <style>
    :root { color-scheme: dark; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: #62b1e8;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      touch-action: none; 
      user-select: none;
    }
    #app { position: fixed; inset: 0; touch-action: none; }
    canvas { display: block; touch-action: none; }
    
    #touch-controls {
      position: fixed; inset: 0; z-index: 20; pointer-events: none;
    }
    
    #joystick-base {
      position: absolute; left: 40px; bottom: 40px;
      width: 100px; height: 100px; border-radius: 50%;
      background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2);
      pointer-events: auto;
    }
    
    #joystick-knob {
      position: absolute; left: 50%; top: 50%;
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255, 255, 255, 0.3);
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    #boost-btn {
      position: fixed; right: 20px; bottom: 25px;
      width: 75px; height: 75px; border-radius: 50%;
      color: white; font-weight: bold; font-size: 14px;
      display: flex; align-items: center; justify-content: center;
      user-select: none; pointer-events: auto;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      background: rgba(30, 64, 175, 0.85); border: 2px solid rgba(96, 165, 250, 0.6);
      transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 20;
    }

    #touch-controls {
      display: none !important;
    }
    body.force-mobile #world-map,
    .force-mobile #world-map {
      display: none !important;
    }
    .dg { zoom: 1.2 !important; }
    .dg.ac { zoom: 1.2 !important; }
  </style>
  <script>
    (function() {
      var params = new URLSearchParams(window.location.search);
      if (params.has('mobile') || window.self !== window.top || window.innerWidth <= 1024) {
        document.documentElement.classList.add('force-mobile');
        document.addEventListener('DOMContentLoaded', function() {
          document.body.classList.add('force-mobile');
        });
      }
    })();
  </script>

  <style>
    /* modern top bar */
    #top-bar {
      position: fixed;
      top: 18px;
      right: 20px;
      left: 20px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 14px;
      z-index: 100;
      pointer-events: none;
      background: transparent;
      padding: 0;
      border: none;
    }
    #top-bar > * { pointer-events: auto; }
    #fps-counter {
      color: rgba(255, 255, 255, 0.95);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.35), 0 0 8px rgba(0, 0, 0, 0.2);
      user-select: none;
      pointer-events: none;
      line-height: 1;
      margin-right: auto;
    }
    #top-model-switcher {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(15, 20, 28, 0.94);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      padding: 3px 6px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
      pointer-events: auto;
      user-select: none;
      transition: border-color 0.2s ease, background 0.2s ease;
    }
    #top-model-switcher:hover {
      background: rgba(18, 22, 32, 0.85);
      border-color: rgba(255, 255, 255, 0.28);
    }
    .top-model-arrow {
      background: transparent !important;
      color: rgba(255, 255, 255, 0.7) !important;
      border: none !important;
      padding: 4px 6px !important;
      cursor: pointer !important;
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      line-height: 1 !important;
      transition: color 0.15s ease, transform 0.15s ease, background 0.15s ease !important;
      border-radius: 4px !important;
    }
    .top-model-arrow:hover {
      color: #ffffff !important;
      transform: scale(1.15) !important;
      background: rgba(255, 255, 255, 0.1) !important;
    }
    .top-model-arrow:active {
      transform: scale(0.85) !important;
    }
    .top-model-name {
      color: rgba(255, 255, 255, 0.95);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
      padding: 2px 6px;
      min-width: 54px;
      text-align: center;
      cursor: pointer;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
      transition: color 0.15s ease;
    }
    .top-model-name:hover {
      color: #38bdf8;
    }
    @media (max-width: 600px) {
      .top-model-name { min-width: 44px !important; font-size: 11px !important; }
    }
    #fps-counter {
      color: rgba(255, 255, 255, 0.95);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-size: 16px;
      font-weight: 500;
      letter-spacing: 0.5px;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.35), 0 0 8px rgba(0, 0, 0, 0.2);
      user-select: none;
      pointer-events: none;
      line-height: 1;
    }
    #top-bar button {
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.95);
      cursor: pointer;
      font-size: 19px;
      padding: 4px;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.35), 0 0 8px rgba(0, 0, 0, 0.2);
      transition: transform 0.15s ease, opacity 0.15s ease, color 0.15s ease;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }
    #top-bar button:hover {
      opacity: 1;
      transform: scale(1.08);
    }
    #top-bar button:active { transform: scale(0.88); opacity: 0.7; }

    /* lil-gui positioning below top bar */
    .lil-gui.root {
      position: fixed !important;
      top: 58px !important;
      right: 20px !important;
      left: auto !important;
      max-width: min(340px, 92vw) !important;
      max-height: calc(100vh - 78px) !important;
      overflow-y: auto !important;
      border-radius: 12px !important;
      background: rgba(15, 20, 28, 0.96) !important;
      border: 1px solid rgba(255, 255, 255, 0.15) !important;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6) !important;
      z-index: 95 !important;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif !important;
    }

  </style>
</head>
<body>
<div id="debug-overlay" style="position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; background: #b91c1c; color: #ffffff; padding: 16px 24px; border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); max-width: 90%; display: none;"></div>
<script>
function showError(msg) {
    var overlay = document.getElementById('debug-overlay');
    if (!overlay) return;
    overlay.style.display = 'block';
    overlay.innerHTML = '<div style="font-family: sans-serif; font-size: 14px; line-height: 1.5;">' +
        '<div style="font-weight: bold; margin-bottom: 6px;">Runtime Notification</div>' +
        '<div style="margin-bottom: 12px; word-break: break-word;">' + msg + '</div>' +
        '<div style="display: flex; gap: 8px;">' +
            '<a href="?webgl=1" style="display: inline-block; padding: 6px 12px; background: #ffffff; color: #000000; text-decoration: none; border-radius: 4px; font-weight: bold; font-size: 12px;">WebGL Fallback Mode</a>' +
            '<button onclick="window.location.reload()" style="padding: 6px 12px; background: rgba(255,255,255,0.2); color: #ffffff; border: 1px solid #ffffff; border-radius: 4px; font-weight: bold; font-size: 12px; cursor: pointer;">Reload</button>' +
            '<button onclick="this.closest(\'#debug-overlay\').style.display=\'none\'" style="padding: 6px 12px; background: transparent; color: #ffffff; border: 1px solid rgba(255,255,255,0.5); border-radius: 4px; font-size: 12px; cursor: pointer;">Dismiss</button>' +
        '</div>' +
    '</div>';
}
window.onerror = function(msg, url, line, col, error) {
    if (msg && (msg.includes('ResizeObserver') || msg.includes('Script error'))) return;
    showError('Error: ' + msg + ' at line ' + line);
};
window.addEventListener("unhandledrejection", function(event) {
    var reason = event.reason ? (event.reason.message || event.reason) : "unknown";
    if (reason && reason.includes('Device Lost')) return;
    showError('Unhandled Rejection: ' + reason);
});
</script>
